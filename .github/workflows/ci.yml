name: CI

on:
  push:
    branches: [main]
  pull_request:

# Node 22+ is required: the database driver is node:sqlite, built into Node.
env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API (schema + both suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Verify the schema migrates cleanly
        run: npm run check:schema --workspace @usc/server

      - name: Seed a clean database
        run: node apps/server/src/seed.js --reset

      - name: Start the API
        run: node apps/server/src/index.js &
        env:
          USC_JWT_SECRET: ci-only-secret-not-used-anywhere-real
          # Never reach out to the push service from CI.
          USC_PUSH_DISABLED: '1'

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API did not start in time"; exit 1

      - name: Core suite
        run: node apps/server/test/smoke.mjs

      - name: Feature suite
        run: node apps/server/test/features.mjs

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @usc/web

  mobile:
    name: Mobile bundle (Android + iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Bundling catches import and syntax errors across every screen without
      # needing a simulator or an Expo account.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir .ci-android
        working-directory: apps/mobile

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir .ci-ios
        working-directory: apps/mobile
