name: CI

on:
  push:
    branches: [main]
  pull_request:

# Node 22+ is required by the toolchain and by PGlite's WebAssembly build.
env:
  NODE_VERSION: '22'

jobs:
  api:
    name: API (all suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # verify.mjs reseeds, starts the API, runs every suite and stops it, in
      # that order: PGlite is single-writer, so seeding a running server would
      # corrupt the data directory. No database service is needed - PGlite is
      # Postgres compiled to WebAssembly.
      - name: Seed, start and run every suite
        run: npm run verify --workspace @usc/server
        env:
          USC_JWT_SECRET: ci-only-secret-not-used-anywhere-real
          USC_PUSH_DISABLED: '1'

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @usc/web

  mobile:
    name: Mobile bundle (Android + iOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Bundling catches import and syntax errors across every screen without
      # needing a simulator or an Expo account.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir .ci-android
        working-directory: apps/mobile

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir .ci-ios
        working-directory: apps/mobile
