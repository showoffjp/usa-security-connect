<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001F3F" />
    <meta name="description" content="USA Security Connect - workforce operations for USA Security & Protection Group." />
    <title>USA Security Connect</title>
    <link rel="icon" href="/shield.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="USC Connect" />
    <script>
      // Night mode before the first paint, so a dark screen never flashes
      // white. The same rule as src/lib/theme.js.
      (function () {
        var pref = 'auto';
        try { pref = localStorage.getItem('usc.theme') || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <script>
      // If the app's stylesheet fails to load on a flaky connection, fetch it
      // again rather than leave an unstyled page. Error events do not bubble,
      // so this listens in the capture phase.
      document.addEventListener(
        'error',
        function (e) {
          var el = e.target;
          if (!el || el.tagName !== 'LINK' || el.rel !== 'stylesheet' || el.href.indexOf('/assets/') < 0) return;
          var tries = Number(el.getAttribute('data-retry') || 0);
          if (tries >= 3) return;
          var again = el.cloneNode();
          again.setAttribute('data-retry', String(tries + 1));
          again.href = el.href.split('?')[0] + '?retry=' + (tries + 1);
          setTimeout(function () {
            el.parentNode && el.parentNode.replaceChild(again, el);
          }, 500 * (tries + 1));
        },
        true
      );
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
